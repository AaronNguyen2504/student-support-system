# One-command demo: docker compose up  ->  http://localhost:8080
services:
  web:
    build: ./docker
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/config.local.php:/var/www/html/config.local.php:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: demo
    volumes:
      - ./sql/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
